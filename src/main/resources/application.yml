server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: channel-platform
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/channel_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:xanny24678}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-in-production-must-be-32-chars}
  expiration: 2592000000     # 30天（毫秒）
  refresh-expiration: 2592000000  # 30天

# DeepSeek API
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-959ea8abef3847cfaf21b459c8aedd52}
  model: deepseek-chat
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}

# SpringDoc Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: 渠道投放管理平台 API
    description: 国金证券渠道投放管理平台接口文档
    version: 1.0.0


